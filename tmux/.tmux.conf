
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

set -g default-shell "$SHELL"

# List of plugins
# dracula rewrites status-right; continuum must stay last so its autosave hook
# survives (tmux-continuum README, "Known Issues").
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'dracula/tmux'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# dracula theme config
set -g @dracula-plugins "time"
set -g @dracula-show-left-icon "#S"
# dracula has no hostname segment; the time format is inserted raw into
# status-right, so it carries a second segment for #h.
set -g @dracula-time-format "%Y-%m-%d %H:%M #[fg=#282a36,bg=#bd93f9] #h"
# tmux 3.8 underlines the current window by default; dracula doesn't reset it.
set -g window-status-current-style default
setw -g window-status-separator ""

# tmux 3.8 colours its menus and trees from these; Dracula has no blue, so
# purple. -q skips them on older tmux, which does not have them.
set -gq dark-theme-black "#282a36"
set -gq dark-theme-white "#f8f8f2"
set -gq dark-theme-light-grey "#6272a4"
set -gq dark-theme-dark-grey "#44475a"
set -gq dark-theme-green "#50fa7b"
set -gq dark-theme-yellow "#f1fa8c"
set -gq dark-theme-red "#ff5555"
set -gq dark-theme-blue "#bd93f9"
set -gq dark-theme-cyan "#8be9fd"
set -gq dark-theme-magenta "#ff79c6"

# tmux-resurrect and tmux-continuum config
## Restore Panes
set -g @resurrect-capture-pane-contents 'on'
## Restore last saved environment (automatically)
set -g @continuum-restore 'on'

# Re-number windows
set -g renumber-windows on

bind s choose-tree -Zs -O name

# Mouse defaults to on since tmux 3.8. Apps in the alternate screen without
# mouse reporting (nvim with mouse='') get arrow keys, like kitty does.
set -g mouse on
bind -n WheelUpPane if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" \
  { send -M } { if -F "#{alternate_on}" { send Up } { copy-mode -e } }
bind -n WheelDownPane if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" \
  { send -M } { if -F "#{alternate_on}" { send Down } }

# Initialize TMUX plugin manager
run '~/.tmux/plugins/tpm/tpm'

# Must follow TPM: dracula hardcodes these (scripts/dracula.sh).
set -g status-left "#[bg=#bd93f9]#[fg=#282a36]"
set -ga status-left "#{?client_prefix,#[bg=#f1fa8c],} #S "
# Each window starts with a left-edge line (U+258F) acting as a border.
setw -g window-status-current-format "#[fg=#44475a]#[bg=#50fa7b]▏"
setw -ga window-status-current-format "#[fg=#282a36]#I: #W "
setw -g window-status-format "#[fg=#44475a]#[bg=#6272a4]▏"
setw -ga window-status-format "#[fg=#f8f8f2]#I: #W "

