min_version = "2026.10.21"

[settings]
idiomatic_version_file_enable_tools = ["node", "python", "ruby", "java", "go"]

# Locks only the tools declared here; project configs keep their own policy.
[tool_config]
locked = true

[tools]
node = ["24.22.1", "22.23.4"]
python = ["3.14.2", "3.10.19"]
ruby = "3.4.1"
go = ["1.26.4", "1.24.3"]
java = ["temurin-25.0.5+8.0.LTS", "temurin-17.0.20+8", "temurin-11.0.32+101"]
rust = "1.99.1"
dotnet = "10.0.403"
dart = "3.13.7"
flutter = { version = "3.47.8", os = ["macos", "linux/x64"] }

neovim = "0.12.6"
fzf = "0.74.5"
fd = "10.5.0"
ripgrep = "15.2.0"
marksman = "2026-02-08"
glow = "3.0.0"
tree-sitter = "0.27.1"
gh = "2.103.3"
uv = "0.13.6"
pnpm = "12.16.1"
osv-scanner = "2.7.0"
shellcheck = "0.11.0"
"aqua:bats-core/bats-core" = "1.14.0"
"github:cantino/mcfly" = { version = "0.9.4", os = ["linux"] }

lua-language-server = "3.19.2"
rust-analyzer = "2026-10-26"
terraform-ls = "0.39.0"
biome = "2.6.3"
"go:golang.org/x/tools/gopls" = "0.24.0"
"go:github.com/go-delve/delve/cmd/dlv" = "1.27.2"
"gem:solargraph" = "0.61.0"
"cargo:neocmakelsp" = "0.11.2"

[tools."github:redhat-developer/vscode-xml"]
version = "0.29.3"
rename_exe = "lemminx"

[tools."github:redhat-developer/vscode-xml".platforms]
macos-arm64 = { asset_pattern = "lemminx-osx-aarch_64.zip" }
macos-x64 = { asset_pattern = "lemminx-osx-x86_64.zip" }
linux-x64 = { asset_pattern = "lemminx-linux-x86_64.zip" }
linux-arm64 = { asset_pattern = "lemminx-linux-aarch_64.zip" }

[tools."github:OmniSharp/omnisharp-roslyn"]
version = "2.0.0"

[tools."github:OmniSharp/omnisharp-roslyn".platforms]
macos-arm64 = { asset_pattern = "omnisharp-osx-arm64.tar.gz" }
macos-x64 = { asset_pattern = "omnisharp-osx-x64.tar.gz" }
linux-x64 = { asset_pattern = "omnisharp-linux-x64.tar.gz" }
linux-arm64 = { asset_pattern = "omnisharp-linux-arm64.tar.gz" }

[tools."github:vadimcn/codelldb"]
version = "1.12.3"
format = "zip"
bin_path = "extension/adapter"

[tools."github:vadimcn/codelldb".platforms]
macos-arm64 = { asset_pattern = "codelldb-darwin-arm64.vsix" }
macos-x64 = { asset_pattern = "codelldb-darwin-x64.vsix" }
linux-x64 = { asset_pattern = "codelldb-linux-x64.vsix" }
linux-arm64 = { asset_pattern = "codelldb-linux-arm64.vsix" }

[tools."github:microsoft/vscode-js-debug"]
version = "1.140.0"
asset_pattern = "js-debug-dap-v*.tar.gz"

[tools."github:ryanoasis/nerd-fonts"]
version = "3.5.1"
asset_pattern = "Hack.tar.xz"

