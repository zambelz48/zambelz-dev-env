  { reader = "dotnet-single-file", path = "marksman" },
]

[mise-tool.neovim]
repo = "neovim/neovim"
cpe = ["cpe:2.3:a:neovim:neovim"]

[mise-tool.node]
repo = "nodejs/node"
cpe = ["cpe:2.3:a:nodejs:node.js"]
cna = [{ source = "support@hackerone.com", keyword = "Node.js", vendor = "nodejs", product = "node" }]
feeds = ["node"]
eol = "nodejs"

[mise-tool.osv-scanner]
