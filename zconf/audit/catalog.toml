upstream_tag = "{version}"
bundles = [
  { name = "lemminx", repo = "eclipse-lemminx/lemminx", version_from = "package.json:xmlServer.version", osv = ["Maven:org.eclipse.lemminx:org.eclipse.lemminx"], upstream_tag = "{version}", upstream_files = ["pom.xml"] },
]

[mise-tool."github:ryanoasis/nerd-fonts"]
repo = "ryanoasis/nerd-fonts"

[mise-tool."github:vadimcn/codelldb"]
repo = "vadimcn/codelldb"
upstream_files = ["Cargo.lock", "package-lock.json"]
installed = [
  { reader = "command-version", path = "extension/lldb/bin/lldb", args = ["--version"], regex = 'lldb version ([0-9.]+)', cpe = "cpe:2.3:a:llvm:llvm" },
]

[mise-tool.glow]
repo = "charmbracelet/glow"
upstream_files = ["go.mod"]

[mise-tool.go]
repo = "golang/go"
cpe = ["cpe:2.3:a:golang:go"]
osv = ["Go:stdlib"]
eol = "go"

[mise-tool."go:github.com/go-delve/delve/cmd/dlv"]
