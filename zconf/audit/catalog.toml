[mise-tool."http:jdtls"]
repo = "eclipse-jdtls/eclipse.jdt.ls"

[mise-tool."http:kotlin-lsp"]
repo = "Kotlin/kotlin-lsp"

[mise-tool.java]
repo = "adoptium/temurin-build"
cpe = ["cpe:2.3:a:oracle:openjdk", "cpe:2.3:a:eclipse:temurin"]
cna = [{ source = "secalert_us@oracle.com", keyword = "Java SE", vendor = "Oracle Corporation", product = "Oracle Java SE", product_match = "contains", version_prefix = "Oracle Java SE:", listed_means = "up-to-in-line" }]
version_pattern = '^temurin-([0-9]+\.[0-9]+\.[0-9]+)'
eol = "eclipse-temurin"

[mise-tool.lua-language-server]
repo = "LuaLS/lua-language-server"
