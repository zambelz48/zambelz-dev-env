[mise.mise]
repo = "jdx/mise"
cpe = ["cpe:2.3:a:jdx:mise"]
osv = ["crates.io:mise"]
upstream_files = ["Cargo.lock"]

[mise-tool."aqua:bats-core/bats-core"]
repo = "bats-core/bats-core"
osv = ["npm:bats"]

[mise-tool.biome]
repo = "biomejs/biome"
osv = ["npm:@biomejs/biome"]
upstream_tag = "@biomejs/biome@{version}"
upstream_files = ["Cargo.lock"]

[mise-tool."cargo:neocmakelsp"]
repo = "neocmakelsp/neocmakelsp"
osv = ["crates.io:neocmakelsp"]
upstream_files = ["Cargo.lock"]

[mise-tool.cmake]
repo = "Kitware/CMake"
cpe = ["cpe:2.3:a:cmake_project:cmake"]
vendored = [
  { name = "curl", path = "Utilities/cmcurl/include/curl/curlver.h", regex = 'LIBCURL_VERSION "([0-9.]+)', cpe = "cpe:2.3:a:haxx:libcurl" },
  { name = "zlib", path = "Utilities/cmzlib/zlib.h", regex = 'ZLIB_VERSION "([0-9.]+)', cpe = "cpe:2.3:a:zlib:zlib" },
  { name = "libarchive", path = "Utilities/cmlibarchive/libarchive/archive.h", regex = 'ARCHIVE_VERSION_ONLY_STRING "([0-9.]+)', cpe = "cpe:2.3:a:libarchive:libarchive" },
  { name = "expat", path = "Utilities/cmexpat/lib/expat.h", regex = ['XML_MAJOR_VERSION ([0-9]+)', 'XML_MINOR_VERSION ([0-9]+)', 'XML_MICRO_VERSION ([0-9]+)'], cpe = "cpe:2.3:a:libexpat_project:libexpat" },
  { name = "nghttp2", path = "Utilities/cmnghttp2/lib/includes/nghttp2/nghttp2ver.h", regex = 'NGHTTP2_VERSION "([0-9.]+)', cpe = "cpe:2.3:a:nghttp2:nghttp2" },
  { name = "libuv", path = "Utilities/cmlibuv/include/uv/version.h", regex = ['UV_VERSION_MAJOR ([0-9]+)', 'UV_VERSION_MINOR ([0-9]+)', 'UV_VERSION_PATCH ([0-9]+)'], cpe = "cpe:2.3:a:libuv:libuv" },
  { name = "zstd", path = "Utilities/cmzstd/lib/zstd.h", regex = ['ZSTD_VERSION_MAJOR\s+([0-9]+)', 'ZSTD_VERSION_MINOR\s+([0-9]+)', 'ZSTD_VERSION_RELEASE\s+([0-9]+)'], cpe = "cpe:2.3:a:facebook:zstandard" },
  { name = "liblzma", path = "Utilities/cmliblzma/liblzma/api/lzma/version.h", regex = ['LZMA_VERSION_MAJOR ([0-9]+)', 'LZMA_VERSION_MINOR ([0-9]+)', 'LZMA_VERSION_PATCH ([0-9]+)'], cpe = "cpe:2.3:a:tukaani:xz" },
  { name = "bzip2", path = "Utilities/cmbzip2/bzlib_private.h", regex = 'BZ_VERSION\s+"([0-9.]+)', cpe = "cpe:2.3:a:bzip:bzip2" },
]

[mise-tool.dart]
repo = "dart-lang/sdk"
cpe = ["cpe:2.3:a:dart:dart_software_development_kit"]
upstream_tag = "{version}"
upstream_deps = "DEPS"

[mise-tool.dotnet]
repo = "dotnet/runtime"
cpe = ["cpe:2.3:a:microsoft:.net_sdk"]
feeds = ["dotnet"]
eol = "dotnet"

[mise-tool.fd]
repo = "sharkdp/fd"
osv = ["crates.io:fd-find"]
upstream_files = ["Cargo.lock"]

[mise-tool.flutter]
repo = "flutter/flutter"
cpe = ["cpe:2.3:a:flutter:flutter"]
upstream_tag = "{version}"
upstream_files = ["pubspec.lock"]
upstream_deps = "DEPS"

[mise-tool.fzf]
repo = "junegunn/fzf"
cpe = ["cpe:2.3:a:junegunn:fzf"]
upstream_files = ["go.mod"]

[mise-tool."gem:solargraph"]
repo = "castwide/solargraph"
osv = ["RubyGems:solargraph"]

[mise-tool.gh]
repo = "cli/cli"
cpe = ["cpe:2.3:a:github:cli"]
upstream_files = ["go.mod"]

[mise-tool."github:OmniSharp/omnisharp-roslyn"]
repo = "OmniSharp/omnisharp-roslyn"
upstream_files = ["Directory.Packages.props"]

[mise-tool."github:cantino/mcfly"]
repo = "cantino/mcfly"
osv = ["crates.io:mcfly"]
upstream_files = ["Cargo.lock"]

[mise-tool."github:microsoft/vscode-js-debug"]
